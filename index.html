<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Snake Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel">
        <div class="header">
          <div>
            <p class="label">Score</p>
            <p id="score" class="value">0</p>
          </div>
          <div>
            <p class="label">Speed</p>
            <p id="speed" class="value">Normal</p>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="600" height="600"></canvas>
          <div id="overlay" class="overlay hidden">
            <div class="overlay-card">
              <h2 id="overlayTitle">Game Over</h2>
              <p id="overlayMessage">Press space or tap to play again.</p>
              <button id="restartBtn" class="primary-btn">Play Again</button>
            </div>
          </div>
        </div>
        <div class="controls">
          <button data-direction="ArrowUp">↑</button>
          <div>
            <button data-direction="ArrowLeft">←</button>
            <button data-direction="ArrowDown">↓</button>
            <button data-direction="ArrowRight">→</button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h1>Leaderboard</h1>
          <ol id="leaderboard" class="leaderboard-list"></ol>
          <div class="sidebar-actions">
            <button id="resetLeaderboardBtn" class="secondary-btn">
              Reset leaderboard
            </button>
          </div>
        </div>
        <div class="panel info-panel">
          <h2>How to play</h2>
          <ul>
            <li>Use arrow keys or buttons to move.</li>
            <li>Eat apples to grow and score more points.</li>
            <li>Avoid walls and your own tail.</li>
          </ul>
          <p>Leaderboard saves your top 5 scores locally in the browser.</p>
        </div>
      </aside>
    </main>

<script src="leaderboard.js"></script>
  <script src="audio.js"></script>
  <script src="script.js"></script>
  </body>
</html>
